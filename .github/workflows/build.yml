name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .Net SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Build
        run: dotnet build -c Release
