name: Publish Nuget Package

on:
  push:
    tags:
      - v*

jobs:
  test-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .Net SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.x

      - name: Test Unit and CI suites
        run: >
          dotnet test Tests/Tests.csproj -c Release
          --settings Tests/ci.runsettings
          --filter "Category=Unit|Category=CI"
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-windows
          path: TestResults/

  deploy:
    needs: test-windows
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .Net SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Modify README.md for NuGet
        run: |
          sed -i 's/# <img[^>]*>/# /' README.md

      - name: Build
        run: dotnet build -c Release

      - name: Make Nuget Packages
        run: dotnet pack -c Release

      - name: NuGet login (OIDC to temp API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: login
        with:
          user: Nefarius

      - name: Publish To Nuget
        run: |
          dotnet nuget push bin/*.nupkg --skip-duplicate -s https://api.nuget.org/v3/index.json
          dotnet nuget push bin/*.snupkg --skip-duplicate -s https://api.nuget.org/v3/index.json
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
